<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q4 – Responsive grid layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <!--
      Source order is A–H: the logical reading order, which keyboard users and
      screen readers follow. CSS only changes the visual placement.
    -->
    <section class="box a" aria-labelledby="h-a"><h2 id="h-a">A</h2><p><a href="#a">Link A</a></p></section>
    <section class="box b" aria-labelledby="h-b"><h2 id="h-b">B</h2><p><a href="#b">Link B</a></p></section>
    <section class="box c" aria-labelledby="h-c"><h2 id="h-c">C</h2><p><a href="#c">Link C</a></p></section>
    <section class="box d" aria-labelledby="h-d"><h2 id="h-d">D</h2><p><a href="#d">Link D</a></p></section>
    <section class="box e" aria-labelledby="h-e"><h2 id="h-e">E</h2><p><a href="#e">Link E</a></p></section>
    <section class="box f" aria-labelledby="h-f"><h2 id="h-f">F</h2><p><a href="#f">Link F</a></p></section>
    <section class="box g" aria-labelledby="h-g"><h2 id="h-g">G</h2><p><a href="#g">Link G</a></p></section>
    <section class="box h" aria-labelledby="h-h"><h2 id="h-h">H</h2><p><a href="#h">Link H</a></p></section>
  </main>
</body>
</html>
